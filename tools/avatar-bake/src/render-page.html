<!doctype html>
<!-- Headless render stage driven by bake.mjs over playwright. Everything visual lives here:
     the proof's lighting/camera (the "Cube Pets Proof" recipe), idle-pose sampling for the
     skinned Mini Characters (their bind pose is arms-out), and the shared-colormap recolor. -->
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
    background: transparent;
  }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "/three/build/three.module.js",
      "three/addons/": "/three/examples/jsm/"
    }
  }
</script>
<body>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    // Supersampled render target: 2x the sprite size, downscaled once at encode time.
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true,
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    document.body.appendChild(renderer.domElement);

    // Neutral three-point studio light from the proof: strong ambient so the flat-color
    // low-poly style stays saturated, key/fill/rim for form.
    function makeScene() {
      const scene = new THREE.Scene();
      scene.add(new THREE.AmbientLight(0xffffff, 1.35));
      const key = new THREE.DirectionalLight(0xffffff, 1.8);
      key.position.set(2.5, 4, 3);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.6);
      fill.position.set(-3, 1.5, 2);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xfff6e8, 0.5);
      rim.position.set(0, 3, -4);
      scene.add(rim);
      return scene;
    }

    const loader = new GLTFLoader();

    // Skinned characters ship arms-out in bind pose, so they must be posed from the idle
    // clip. Sampled at 5% of the duration, NOT mid-clip: probed frames showed mid-idle
    // catches some characters mid-gesture (arm raised over the face), while the early frame
    // is a uniformly relaxed arms-down stance. Pets' clips are motion loops; pets stay
    // unposed (their bind pose is the sculpted stand).
    function poseIdle(gltf) {
      const clip =
        gltf.animations.find((a) => a.name === "idle") ??
        gltf.animations.find((a) => a.name === "static");
      if (!clip) return;
      const mixer = new THREE.AnimationMixer(gltf.scene);
      mixer.clipAction(clip).play();
      mixer.update(clip.duration * 0.05);
    }

    // Consistent 3/4 hero angle, slightly above eye line, subject centered and filling the
    // square. Every sprite in the set uses exactly this framing.
    function renderModel(root, size) {
      renderer.setSize(size * 2, size * 2, false);
      const scene = makeScene();
      const holder = new THREE.Group();
      holder.add(root);
      holder.rotation.y = -Math.PI * 0.2;
      scene.add(holder);
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(holder);
      const boxSize = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(boxSize.x, boxSize.y, boxSize.z);
      const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
      camera.position.set(center.x, center.y + maxDim * 0.45, center.z + maxDim * 2.05);
      camera.lookAt(center.x, center.y - maxDim * 0.02, center.z);
      renderer.render(scene, camera);
      return renderer.domElement;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    // UV-area-weighted histogram of which colormap texels a model actually wears - the
    // analysis behind each roster entry's committed recolorTargets.
    function dominantColors(root, image) {
      const canvas = document.createElement("canvas");
      canvas.width = image.width;
      canvas.height = image.height;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(image, 0, 0);
      const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
      const histogram = new Map();
      root.traverse((object) => {
        if (!object.isMesh) return;
        const geometry = object.geometry;
        const uv = geometry.attributes.uv;
        const position = geometry.attributes.position;
        if (!uv) return;
        const index = geometry.index ? geometry.index.array : null;
        const triangleCount = index ? index.length / 3 : position.count / 3;
        const a = new THREE.Vector3();
        const b = new THREE.Vector3();
        const c = new THREE.Vector3();
        for (let t = 0; t < triangleCount; t++) {
          const i0 = index ? index[t * 3] : t * 3;
          const i1 = index ? index[t * 3 + 1] : t * 3 + 1;
          const i2 = index ? index[t * 3 + 2] : t * 3 + 2;
          a.fromBufferAttribute(position, i0);
          b.fromBufferAttribute(position, i1);
          c.fromBufferAttribute(position, i2);
          const area = b.sub(a).cross(c.sub(a)).length() * 0.5;
          const u = (uv.getX(i0) + uv.getX(i1) + uv.getX(i2)) / 3;
          const v = (uv.getY(i0) + uv.getY(i1) + uv.getY(i2)) / 3;
          const x = Math.min(canvas.width - 1, Math.max(0, Math.floor(u * canvas.width)));
          const y = Math.min(canvas.height - 1, Math.max(0, Math.floor(v * canvas.height)));
          const offset = (y * canvas.width + x) * 4;
          const key = pixels[offset] + "," + pixels[offset + 1] + "," + pixels[offset + 2];
          histogram.set(key, (histogram.get(key) ?? 0) + area);
        }
      });
      return [...histogram.entries()]
        .sort((a2, b2) => b2[1] - a2[1])
        .map(([key, weight]) => ({
          hex:
            "#" +
            key
              .split(",")
              .map((v) => Number(v).toString(16).padStart(2, "0"))
              .join(""),
          weight,
        }));
    }

    // The proven recolor: replace colormap pixels within deltaRGB < 42 of a target cell with
    // the accent scaled by the pixel's luminance ratio - shade cells recolor consistently,
    // all other cells (eyes, skin, hair) survive untouched.
    function recolorColormap(image, targetHexes, accentHex, tolerance) {
      const canvas = document.createElement("canvas");
      canvas.width = image.width;
      canvas.height = image.height;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(image, 0, 0);
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      const parseHex = (hex) => [
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16),
      ];
      const targets = targetHexes.map(parseHex);
      const accent = parseHex(accentHex);
      const luminance = (c) => 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
      for (let i = 0; i < data.length; i += 4) {
        for (const target of targets) {
          const dr = data[i] - target[0];
          const dg = data[i + 1] - target[1];
          const db = data[i + 2] - target[2];
          if (Math.sqrt(dr * dr + dg * dg + db * db) < tolerance) {
            const ratio = luminance([data[i], data[i + 1], data[i + 2]]) / (luminance(target) || 1);
            data[i] = Math.min(255, accent[0] * ratio);
            data[i + 1] = Math.min(255, accent[1] * ratio);
            data[i + 2] = Math.min(255, accent[2] * ratio);
            break;
          }
        }
      }
      context.putImageData(imageData, 0, 0);
      return canvas;
    }

    function applyColormap(root, colormapCanvas) {
      root.traverse((object) => {
        if (object.isMesh && object.material && object.material.map) {
          const material = object.material.clone();
          // Cloning the original texture preserves flipY/wrap/filters/colorSpace exactly.
          const texture = object.material.map.clone();
          texture.image = colormapCanvas;
          texture.needsUpdate = true;
          material.map = texture;
          object.material = material;
        }
      });
    }

    // Downscale the 2x render once and encode webp with alpha.
    function encodeWebp(sourceCanvas, size, quality) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext("2d");
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";
      context.drawImage(sourceCanvas, 0, 0, size, size);
      return canvas.toDataURL("image/webp", quality);
    }

    // Assemble one avatar subject: the character model (posed for humans) plus any extra
    // models composited at the shared origin - the integrated-mobility-aid characters are
    // authored seated at origin, so adding the pack's wheelchair model aligns for free.
    async function loadSubject(avatar) {
      const group = new THREE.Group();
      const primary = await loader.loadAsync(avatar.modelUrl);
      if (avatar.kind === "human") poseIdle(primary);
      group.add(primary.scene);
      for (const extraUrl of avatar.extraModelUrls ?? []) {
        const extra = await loader.loadAsync(extraUrl);
        group.add(extra.scene);
      }
      return { group, primaryScene: primary.scene, clips: primary.animations.map((a) => a.name) };
    }

    // spec per avatar: { id, kind, modelUrl, extraModelUrls, colormapUrl, recolorTargets }
    // job: { avatars, accents: [{id,hex}], size, quality, analyze }
    window.run = async (job) => {
      const colormaps = new Map();
      const output = { sprites: {}, analysis: {} };
      for (const avatar of job.avatars) {
        if (!colormaps.has(avatar.colormapUrl)) {
          colormaps.set(avatar.colormapUrl, await loadImage(avatar.colormapUrl));
        }
        const colormap = colormaps.get(avatar.colormapUrl);

        if (job.analyze) {
          const subject = await loadSubject(avatar);
          const canvas = renderModel(subject.group, job.size);
          output.analysis[avatar.id] = {
            original: encodeWebp(canvas, job.size, 0.9),
            dominant: dominantColors(subject.primaryScene, colormap)
              .slice(0, 10)
              .map((entry) => ({ hex: entry.hex, weight: +entry.weight.toFixed(3) })),
            clips: subject.clips,
          };
          continue;
        }

        output.sprites[avatar.id] = {};
        for (const accent of job.accents) {
          const recolored = recolorColormap(
            colormap,
            avatar.recolorTargets,
            accent.hex,
            avatar.tolerance ?? 42,
          );
          // Fresh GLBs per render: material/texture state stays isolated per sprite.
          const subject = await loadSubject(avatar);
          applyColormap(subject.group, recolored);
          const canvas = renderModel(subject.group, job.size);
          output.sprites[avatar.id][accent.id] = encodeWebp(canvas, job.size, job.quality);
        }
      }
      return output;
    };
    window.readyFlag = true;
  </script>
</body>
