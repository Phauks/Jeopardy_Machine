packages:
  - "apps/*"
  - "packages/*"
  # Repo-committed build tooling that is not shipped code (avatar sprite baking).
  - "tools/*"

# pnpm 10 blocks postinstall scripts by default; these two need theirs (native binary fetch).
# Additions here are deliberate - a new package wanting install scripts is a review moment.
onlyBuiltDependencies:
  - esbuild
  - workerd

# Single source of truth for dependency versions - every package references "catalog:".
# Exact pins on purpose: upgrades are deliberate, one line at a time, in their own commit.
# Verified compatible against the npm registry on 2026-08-13 (see docs/decisions/2026-08-13-m0-version-pins.md):
# kit 3.0.0-next.23 peers vite ^8.0.12 + svelte ^5.56.4 + typescript ^6.0.0 + vite-plugin-svelte ^7;
# adapter-cloudflare 8.0.0-next.6 peers kit ^3.0.0-next.0 + wrangler ^4.118.0;
# vitest-pool-workers 0.21.3 peers vitest ^4.1.0.
catalog:
  "@cloudflare/vitest-pool-workers": 0.21.3
  # Node 22 line to match .nvmrc/engines - NOT the latest major; bump alongside the runtime.
  "@types/node": 22.20.1
  # tools/avatar-bake only (offline sprite pipeline, never bundled into shipped Workers).
  # Verified 2026-08-14 working together against the sandbox's system chromium; playwright is
  # driven with an explicit executablePath, so its own browser download is never used.
  playwright: 1.62.1
  three: 0.185.1
  "@sveltejs/adapter-cloudflare": 8.0.0-next.6
  "@sveltejs/kit": 3.0.0-next.23
  "@sveltejs/vite-plugin-svelte": 7.3.0
  "@tailwindcss/vite": 4.3.3
  svelte: 5.56.9
  svelte-check: 4.7.6
  tailwindcss: 4.3.3
  typescript: 6.0.3
  # Join-flow QR rendering (apps/web room display): zero-dependency MIT SVG generator,
  # verified on npm 2026-08-14 (0.1.3, ~79 KB unpacked, tree-shakes to the one renderSVG call).
  uqr: 0.1.3
  vite: 8.2.1
  vite-plus: 0.2.9
  vitest: 4.1.10
  wrangler: 4.123.0
  zod: 4.4.3
